name: arm64-spike

# Milestone 2 feasibility spike (master prompt §5.4): determine whether a GitHub-hosted
# runner can boot an ARM64 Android emulator and run PocketDev in it. Manual dispatch
# only — this is a measurement, not a pull-request gate. Every verdict produced here is
# recorded honestly in docs/ARM64_FEASIBILITY.md.
#
# Matrix rationale:
# - ubuntu-24.04-arm probes whether a *native* ARM64 host can run the Android emulator
#   (Google is expected to ship no emulator host package for linux-aarch64, and the
#   runner has no /dev/kvm — both are recorded as measured facts, not assumptions).
# - ubuntu-latest (x86_64) runs an arm64-v8a *guest* image under software emulation;
#   this is the leg that can actually exercise ARM64 ABI behavior in CI.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spike:
    name: Spike (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]
    env:
      ANDROID_API_CANDIDATES: >-
        system-images;android-30;google_apis;arm64-v8a
        system-images;android-34;google_apis;arm64-v8a
        system-images;android-35;google_apis;arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # actions/setup-java v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # android-actions/setup-android v3
        with:
          # Same package set as android-emulator.yml so assembleDebug works.
          packages: "platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0 platform-tools"

      - name: Enable KVM (x86_64 runners only)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "kvm_permissions=enabled"
          else
            echo "kvm_permissions=skipped (no /dev/kvm on this runner)"
          fi

      - name: Install emulator host libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 || true

      - name: Probe host and emulator binary
        id: probe
        run: |
          set -euo pipefail
          mkdir -p spike-out
          {
            echo "runner=${{ matrix.runner }}"
            echo "host_arch=$(uname -m)"
            echo "kvm_node=$(ls -l /dev/kvm 2>&1 || true)"
            echo "groups=$(groups)"
          } | tee spike-out/host-probe.txt

          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f -path '*bin*' | head -1)"
          AVDMANAGER="${SDKMANAGER/sdkmanager/avdmanager}"
          echo "sdkmanager=$SDKMANAGER" | tee -a spike-out/host-probe.txt
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"

          # Accept licenses once. 'yes' exits 141 (SIGPIPE) under pipefail, so it must
          # not be used to gate install success — plain sdkmanager afterwards is
          # non-interactive and returns a truthful exit code.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          EMULATOR="$ANDROID_HOME/emulator/emulator"
          echo "EMULATOR=$EMULATOR" >> "$GITHUB_ENV"
          if [ -x "$EMULATOR" ]; then
            echo "emulator=present (preinstalled on runner)" | tee -a spike-out/host-probe.txt
          else
            echo "emulator=missing; attempting sdkmanager install" | tee -a spike-out/host-probe.txt
            if "$SDKMANAGER" --install 'emulator' > spike-out/sdk-emulator.log 2>&1; then
              echo "emulator=installed via sdkmanager" | tee -a spike-out/host-probe.txt
            else
              echo "emulator=sdkmanager install FAILED (see spike-out/sdk-emulator.log)" | tee -a spike-out/host-probe.txt
            fi
          fi

          if [ -x "$EMULATOR" ]; then
            set +e
            "$EMULATOR" -version > spike-out/emulator-version.txt 2>&1
            echo "emulator_version_exit=$?" | tee -a spike-out/host-probe.txt
            "$EMULATOR" -accel-check > spike-out/accel-check.txt 2>&1
            echo "accel_check_exit=$?" | tee -a spike-out/host-probe.txt
            set -e
            head -c 300 spike-out/emulator-version.txt | tee -a spike-out/host-probe.txt || true
          else
            echo "emulator binary missing" | tee -a spike-out/host-probe.txt
          fi

      - name: Build debug APK on the native ARM64 runner
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          set -uo pipefail
          # Building Android apps on linux-aarch64 works (Gradle/JDK are arch-neutral);
          # this records that separately from the emulator verdict, because the
          # blocker for ARM64 device tests is the missing emulator host package.
          if ./gradlew --no-daemon --stacktrace assembleDebug > spike-out/arm64-build.log 2>&1; then
            echo "arm64_build=SUCCESS" | tee spike-out/arm64-build.txt
            ls -l app/build/outputs/apk/debug/*.apk | tee -a spike-out/arm64-build.txt
          else
            echo "arm64_build=FAILED (see arm64-build.log)" | tee spike-out/arm64-build.txt
          fi

      - name: Install ARM64 system image
        id: image
        run: |
          set -euo pipefail
          IMG=""
          i=0
          for candidate in $ANDROID_API_CANDIDATES; do
            i=$((i + 1))
            echo "Trying $candidate"
            if "$SDKMANAGER" "$candidate" > "spike-out/sdk-image-$i.log" 2>&1; then
              IMG="$candidate"
              break
            fi
            # A pre-existing complete package also counts (idempotent reruns).
            PKG_DIR="$ANDROID_HOME/system-images/$(echo "$candidate" | cut -d';' -f2- | tr ';' '/')"
            if [ -f "$PKG_DIR/package.xml" ]; then
              IMG="$candidate"
              break
            fi
            echo "  unavailable: $(tr '\r' '\n' < "spike-out/sdk-image-$i.log" | grep -E 'Failed|Error|Warning' | tail -2 | tr '\n' ' ')"
          done
          echo "image=$IMG" | tee spike-out/image.txt
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Create AVD
        if: env.IMG != ''
        run: |
          set -euo pipefail
          # avdmanager and emulator disagree about the default AVD location on some
          # runners (avdmanager may use $ANDROID_SDK_HOME/.android/avd, while the
          # emulator searches $ANDROID_AVD_HOME and $ANDROID_SDK_HOME/avd). Pin the
          # AVD home explicitly and hand the same value to the boot step.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n spike -k "$IMG" --force > spike-out/avd-create.txt 2>&1 || true
          tr '\r' '\n' < spike-out/avd-create.txt | grep -vE '^\s*$|^\[' | tail -8
          INI="$(find "$HOME" "$ANDROID_HOME" -maxdepth 6 -name 'spike.ini' 2>/dev/null | head -1)"
          if [ -n "$INI" ]; then
            AVD_HOME="$(dirname "$INI")"
            echo "avd_home=$AVD_HOME" | tee -a spike-out/avd-create.txt
            echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
            echo "AVD_OK=yes" >> "$GITHUB_ENV"
          else
            echo "AVD_OK=no (no spike.ini found under \$HOME or \$ANDROID_HOME)" | tee -a spike-out/avd-create.txt
            echo "AVD_OK=no" >> "$GITHUB_ENV"
          fi
          ls -la "$ANDROID_AVD_HOME" >> spike-out/avd-create.txt 2>&1 || true

      - name: Boot emulator (headless, 35 min budget)
        id: boot
        if: env.IMG != '' && env.AVD_OK == 'yes'
        run: |
          set -uo pipefail
          BOOTED=0
          echo "avd_home=${ANDROID_AVD_HOME:-unset}"
          "$EMULATOR" -list-avds | tee spike-out/avd-list.txt || true
          "$EMULATOR" -avd spike -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -verbose > emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator_pid=$EMU_PID"
          adb start-server
          for i in $(seq 1 210); do
            if adb devices 2>/dev/null | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot" = "1" ]; then BOOTED=1; echo "booted after ${i}0s"; break; fi
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "emulator process exited early"
              break
            fi
            sleep 10
          done
          echo "BOOTED=$BOOTED" | tee spike-out/boot.txt
          echo "BOOTED=$BOOTED" >> "$GITHUB_ENV"

      - name: Build, install, and launch the app
        id: app
        if: env.BOOTED == '1'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug > spike-out/gradle.log 2>&1
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          adb install -r "$APK" > spike-out/install.txt 2>&1
          adb shell am start -n dev.pocketdev/.MainActivity > spike-out/launch.txt 2>&1
          sleep 10
          adb shell dumpsys activity activities > spike-out/activities.txt 2>&1
          if grep -q dev.pocketdev spike-out/activities.txt; then
            echo "APP_LAUNCHED=yes" | tee spike-out/app.txt
          else
            echo "APP_LAUNCHED=no" | tee spike-out/app.txt
          fi
          {
            echo "abi=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "toybox_uname=$(adb shell /system/bin/toybox uname -m 2>&1 | tr -d '\r')"
            echo "linker64=$(adb shell ls -l /system/bin/linker64 2>&1 | tr -d '\r')"
            echo "data_dir_write=$(adb shell run-as dev.pocketdev sh -c 'mkdir -p /data/data/dev.pocketdev/files/usr/bin && echo write-ok' 2>&1 | tr -d '\r')"
          } | tee spike-out/bionic-env.txt

      - name: Record verdict
        if: always()
        run: |
          set -uo pipefail
          BOOTED="${BOOTED:-0}"
          APP_LAUNCHED="${APP_LAUNCHED:-n/a}"
          IMG="${IMG:-}"
          ACCEL="$(grep accel_check_exit spike-out/host-probe.txt 2>/dev/null | tail -1 || echo 'accel_check_exit=unknown')"
          VEXEC="$(grep emulator_version_exit spike-out/host-probe.txt 2>/dev/null | tail -1 || echo 'emulator_version_exit=unknown')"

          if [ -n "$IMG" ]; then
            Q1="YES ($IMG)"
          else
            Q1="NO (no arm64-v8a system image installable on this runner; see sdk-image-*.log)"
          fi
          if grep -q 'accel_check_exit=0' spike-out/host-probe.txt 2>/dev/null; then
            Q2="YES ($ACCEL; /dev/kvm usable)"
          elif [ ! -e /dev/kvm ]; then
            Q2="NO (no /dev/kvm on this runner; $VEXEC)"
          else
            Q2="NO/UNKNOWN ($ACCEL; $VEXEC)"
          fi
          AVD_OK="${AVD_OK:-n/a}"
          [ "$BOOTED" = "1" ] && Q3="YES (boot_completed=1 within 35 min)" || { [ "$AVD_OK" = "no" ] && Q3="NO (AVD could not be created/located)" || Q3="NO (did not boot within budget or emulator failed to start)"; }
          if [ "$BOOTED" = "1" ]; then
            [ "$APP_LAUNCHED" = "yes" ] && Q4="YES" || Q4="NO (installed/launched but not resumed; see spike-out/)"
          else
            Q4="N/A (emulator did not boot)"
          fi
          Q5="N/A — no OpenCode Bionic artifact exists yet (Milestone 4); proxy evidence below"
          if [ "$BOOTED" = "1" ]; then
            Q6="PARTIAL — see bionic-env.txt (abi, toybox exec, linker64, data-dir write)"
          else
            Q6="N/A (emulator did not boot)"
          fi
          ARM64_BUILD="$(cut -d= -f2 spike-out/arm64-build.txt 2>/dev/null | head -1)"
          [ -n "$ARM64_BUILD" ] && BUILD_LINE="**ARM64 APK build on this native runner: $ARM64_BUILD**" || BUILD_LINE="ARM64 APK build: n/a on this leg"

          SUMMARY="$(cat <<EOF
          ## ARM64 spike verdict — \`${{ matrix.runner }}\`

          | # | Question | Verdict |
          | --- | --- | --- |
          | 1 | Compatible ARM64 AVD/system image available? | $Q1 |
          | 2 | Runner provides needed virtualization/KVM? | $Q2 |
          | 3 | Emulator boots reliably headless in Actions? | $Q3 |
          | 4 | App installs and runs in that emulator? | $Q4 |
          | 5 | Bionic OpenCode binary executes? | $Q5 |
          | 6 | Required Android/Termux filesystem/linker behavior? | $Q6 |

          $BUILD_LINE

          Host: \`$(uname -m)\` / runner \`${{ matrix.runner }}\`
          EOF
          )"
          printf '%s\n' "$SUMMARY" | tee spike-out/verdict.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spike evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact v5
        with:
          name: spike-${{ matrix.runner }}
          path: |
            spike-out/
            emulator.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop emulator
        if: always()
        run: |
          pkill -f qemu-system || true
          pkill -f "$ANDROID_HOME/emulator" || true

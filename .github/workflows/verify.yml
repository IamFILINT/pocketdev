name: verify

# Required pull-request gate. All builds and tests run on GitHub-hosted runners only;
# never build or test on the Android phone (master prompt §5).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c  # gradle/actions v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # actions/setup-java v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # gradle/actions v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # android-actions/setup-android v3
        with:
          # API 37 ships as a minor-versioned platform package (android-37.0);
          # there is no bare "platforms;android-37".
          packages: "platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0"

      - name: Build, test, and lint
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact v5
        with:
          name: unit-test-reports
          path: |
            core/build/reports/tests/
            runtime/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact v5
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.*
            runtime/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact v5
        with:
          name: pocketdev-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
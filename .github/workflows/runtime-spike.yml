name: runtime-spike

# ADR-0002 spike (risks R11/R12): provision the pinned bootstrap on the x86_64
# API 30 emulator and measure what actually executes (linker64 hop, W^X, prefix
# behavior, termux-exec preload). Manual only; not a gate. Runs on GitHub-hosted
# runners only (master prompt §0.1, §5); never on the phone.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: Runtime execution spike (x86_64 API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # actions/checkout v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c  # gradle/actions v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # actions/setup-java v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # gradle/actions v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # android-actions/setup-android v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0 platform-tools"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Provision and execute the pinned bootstrap
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set -o pipefail
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=dev.pocketdev.RuntimeSpikeTest \
              -Pandroid.testInstrumentationRunnerArguments.runtimeSpike=true
            adb pull /sdcard/Android/data/dev.pocketdev/files/spike-report.txt runtime-spike-report.txt || true
            cat runtime-spike-report.txt || true

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact v5
        with:
          name: runtime-spike
          path: |
            runtime-spike-report.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Capture emulator screenshot on failure
        if: failure()
        run: |
          adb exec-out screencap -p > emulator-failure.png || true

      - name: Upload emulator screenshot
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact v5
        with:
          name: runtime-spike-failure-screenshot
          path: emulator-failure.png
          if-no-files-found: ignore
          retention-days: 14
